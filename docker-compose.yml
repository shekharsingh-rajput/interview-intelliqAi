version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interview-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: interview-platform
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - interview-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/interview-platform
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./frontend:/app/frontend:ro
    networks:
      - interview-net

  frontend:
    image: nginx:alpine
    container_name: interview-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - interview-net

volumes:
  mongodb_data:

networks:
  interview-net:
    driver: bridge
